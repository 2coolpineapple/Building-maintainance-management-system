

{% extends 'core/base.html' %}

{% block content %}
<div class="container py-4">
  <div class="card mx-auto" style="max-width: 480px; padding: 3rem; border-radius: 15px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1); animation: fadeInScale 0.7s ease-out forwards; text-align: center;">
    <h2 style="font-family: 'Montserrat', sans-serif; font-weight: 700; color: #0056b3; margin-bottom: 1.5rem;">Password reset complete</h2>
    <p style="font-family: 'Lato', sans-serif; font-size: 1.1rem; margin-bottom: 2rem;">Your password has been set. You can now <a href="{% url 'login' %}">log in</a> with your new password.</p>
  </div>
</div>
{% endblock %}
