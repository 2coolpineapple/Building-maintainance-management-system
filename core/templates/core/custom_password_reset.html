{% extends 'core/base.html' %}

{% block content %}
<div class="container py-4">
  <div class="card mx-auto" style="max-width: 480px; padding: 3rem; border-radius: 15px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1); animation: fadeInScale 0.7s ease-out forwards;">
    <h2 class="text-center mb-4" style="font-family: 'Montserrat', sans-serif; font-weight: 700; color: #0056b3;">Reset your password</h2>
    <form method="post" novalidate>
      {% csrf_token %}
      <label for="id_email" style="font-weight: 600; color: #555; font-family: 'Montserrat', sans-serif;">Email address</label>
      {{ form.email }}
      <button type="submit" style="background: linear-gradient(45deg, #007bff, #0056b3); border: none; padding: 0.8rem 1.5rem; font-size: 1.1rem; font-weight: 600; border-radius: 8px; color: #ffffff; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3); width: 100%; margin-top: 1rem;">Send reset email</button>
    </form>
  </div>
</div>

<style>
  input[type="email"] {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: 1px solid #ced4da;
    font-family: 'Lato', sans-serif;
    margin-top: 0.5rem;
    margin-bottom: 1.5rem;
    transition: all 0.3s ease;
  }
  input[type="email"]:focus {
    border-color: #007bff;
    box-shadow: 0 0 0 0.25rem rgba(0, 123, 255, 0.25);
    outline: none;
  }
  @keyframes fadeInScale {
    from {
      opacity: 0;
      transform: scale(0.95) translateY(20px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }
</style>
{% endblock %}
