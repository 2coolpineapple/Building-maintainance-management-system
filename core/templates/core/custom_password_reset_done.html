{% extends 'core/base.html' %}

{% block content %}
<div class="container py-4">
  <div class="card mx-auto" style="max-width: 480px; padding: 3rem; border-radius: 15px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1); animation: fadeInScale 0.7s ease-out forwards; text-align: center;">
    <h2 style="font-family: 'Montserrat', sans-serif; font-weight: 700; color: #0056b3; margin-bottom: 1.5rem;">Password reset sent</h2>
    <p style="font-family: 'Lato', sans-serif; font-size: 1.1rem; margin-bottom: 2rem;">Please check your email for the password reset link.</p>
    <a href="{% url 'login' %}" style="background: linear-gradient(45deg, #007bff, #0056b3); color: #fff; padding: 0.8rem 1.5rem; font-weight: 600; border-radius: 8px; text-decoration: none; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);" onmouseover="this.style.background='linear-gradient(45deg, #0056b3, #003366)'; this.style.boxShadow='0 8px 20px rgba(0, 123, 255, 0.4)';" onmouseout="this.style.background='linear-gradient(45deg, #007bff, #0056b3)'; this.style.boxShadow='0 5px 15px rgba(0, 123, 255, 0.3)';">Back to login</a>
  </div>
</div>
{% endblock %}
